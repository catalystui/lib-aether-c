name: Compile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: C90 / C++98 (x86)
            c: 90
            cpp: 98
            arch: x86
            flags: -m32
          - name: C99 / C++11 (x64)
            c: 99
            cpp: 11
            arch: x64
            flags: -m64

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install 'cmake>=4.3,<5'
          if ('${{ matrix.arch }}' -eq 'x86') {
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib
          }

      - name: Configure
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B target/ci -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_C_STANDARD=${{ matrix.c }} -DCMAKE_CXX_STANDARD=${{ matrix.cpp }} `
            -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_C_EXTENSIONS=OFF -DCMAKE_CXX_EXTENSIONS=OFF `
            -DCMAKE_C_FLAGS=${{ matrix.flags }} -DCMAKE_CXX_FLAGS=${{ matrix.flags }} `
            -DTARGET_VENDOR=linux -DTARGET_SYSTEM=linux -DTARGET_ARCHITECTURE=${{ matrix.arch }} `
            -DCATALYST_CORE_INSTALL=ON

      - name: Compile libraries
        run: cmake --build target/ci --parallel

      - name: Run system identification verification
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & "./build/linux/linux/${{ matrix.arch }}/release/test_athidlib"

      - name: Compile public C headers
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $headers = @(Get-ChildItem include -Recurse -File -Filter '*.h')
          if ($headers.Count -eq 0) {
            Write-Host 'No public C headers to compile.'
          }
          foreach ($header in $headers) {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path include).Path, $header.FullName)
            "#include `"$relative`"" | gcc ${{ matrix.flags }} -std=c${{ matrix.c }} -pedantic-errors -Iinclude -Itarget/ci/_deps/catalystcore-src/include -Itarget/ci/generated -x c -fsyntax-only -
          }

      - name: Compile public C++ headers
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $headers = @(Get-ChildItem include -Recurse -File -Filter '*.hpp')
          if ($headers.Count -eq 0) {
            Write-Host 'No public C++ headers to compile.'
          }
          foreach ($header in $headers) {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path include).Path, $header.FullName)
            "#include `"$relative`"" | g++ ${{ matrix.flags }} -std=c++${{ matrix.cpp }} -pedantic-errors -Iinclude -Itarget/ci/_deps/catalystcore-src/include -Itarget/ci/generated -x c++ -fsyntax-only -
          }

      - name: Verify installed Core consumption
        if: matrix.arch == 'x64'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $prefix = Join-Path (Resolve-Path target/ci).Path 'core-package'
          cmake --install target/ci --prefix "$prefix"

          # Isolate source-built artifacts from the package-consumption build.
          $output = 'build/linux/linux/${{ matrix.arch }}/release'
          Move-Item $output target/ci/source-output
          cmake -S . -B target/ci-package -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_C_STANDARD=${{ matrix.c }} -DCMAKE_CXX_STANDARD=${{ matrix.cpp }} `
            -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_C_EXTENSIONS=OFF -DCMAKE_CXX_EXTENSIONS=OFF `
            -DCMAKE_C_FLAGS=${{ matrix.flags }} -DCMAKE_CXX_FLAGS=${{ matrix.flags }} `
            -DTARGET_VENDOR=linux -DTARGET_SYSTEM=linux -DTARGET_ARCHITECTURE=${{ matrix.arch }} `
            -DCATALYST_AETHER_USE_INSTALLED_CORE=ON "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build target/ci-package --parallel
          & "./$output/test_athidlib"

          # Link and run the existing verification program against shared Aether.
          # Its Core dependency must resolve from the installed package.
          g++ ${{ matrix.flags }} -std=c++${{ matrix.cpp }} -Iinclude -Itarget/ci-package/generated "-I$prefix/include" `
            test/test_athidlib.cpp "-L$output/lib" -lathid '-Wl,-rpath,$ORIGIN' -o "$output/test_athidlib_shared"
          & "./$output/test_athidlib_shared"
